<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Venise Détails</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg: #1c1c1e;
      --card: #2c2c2e;
      --accent: #0A84FF;
      --text: #ffffff;
      --text-sub: #ebebf599;
      --separator: rgba(255,255,255,0.1);
    }

    body {
      margin: 0; padding: 0;
      background: #000;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif;
      height: 100vh; width: 100vw;
      overflow: hidden;
      user-select: none; -webkit-user-select: none;
    }

    /* --- CARTE IMMERSIVE --- */
    #map {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      z-index: 1;
      background: #151515;
    }

    /* --- TIROIR (SHEET) --- */
    #sheet {
      position: absolute; left: 0; right: 0; bottom: 0;
      z-index: 100;
      background: var(--bg);
      border-top-left-radius: 20px; border-top-right-radius: 20px;
      box-shadow: 0 -5px 40px rgba(0,0,0,0.5);
      
      /* Par défaut : Petit (35% écran) pour voir la map */
      height: 35%; 
      transition: height 0.4s cubic-bezier(0.32, 0.72, 0, 1);
      display: flex; flex-direction: column;
    }

    /* Quand on l'agrandit */
    #sheet.expanded { height: 85%; }

    /* Barre de manipulation */
    .handle-area {
      flex: 0 0 30px;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer;
    }
    .handle { width: 40px; height: 5px; background: rgba(255,255,255,0.3); border-radius: 10px; }

    /* Contenu scrollable */
    .content {
      flex: 1; overflow-y: auto; padding: 0 20px 40px 20px;
      -webkit-overflow-scrolling: touch;
    }

    h1 { font-size: 20px; margin: 0 0 4px 0; font-weight: 700; }
    .subtitle { font-size: 13px; color: var(--text-sub); margin-bottom: 20px; }

    /* Liste détaillée */
    .step {
      display: flex; gap: 15px; margin-bottom: 25px; position: relative;
    }
    
    /* Ligne verticale */
    .step::before {
      content: ''; position: absolute; left: 6px; top: 24px; bottom: -35px;
      width: 2px; background: #333; z-index: 0;
    }
    .step:last-child::before { display: none; }

    .icon-box {
      z-index: 1;
      width: 14px; height: 14px; margin-top: 6px; flex-shrink: 0;
      background: var(--accent); border: 2px solid var(--bg); border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(10,132,255,0.3);
    }
    
    .info-box { flex: 1; }
    
    .time {
      font-size: 11px; font-weight: 700; color: var(--text-sub); 
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
    }
    .step-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: #fff; }
    
    /* Détails textuels riches */
    .details {
      background: var(--card); padding: 12px; border-radius: 12px;
      font-size: 14px; line-height: 1.5; color: #ddd;
    }
    .details b { color: #fff; font-weight: 600; }
    .details small { display: block; margin-top: 6px; color: var(--text-sub); font-size: 12px; }

    /* Boutons actions */
    .actions { margin-top: 10px; display: flex; gap: 10px; }
    .btn {
      flex: 1; padding: 8px 0; border-radius: 8px; font-size: 12px; font-weight: 600;
      text-align: center; cursor: pointer; text-decoration: none;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-loc { background: rgba(255,255,255,0.05); color: var(--accent); }
    .btn-go { background: var(--accent); color: white; border: none; }

    /* Bouton Geoloc flottant */
    .fab-loc {
      position: absolute; bottom: 38%; right: 16px; /* Juste au dessus du tiroir fermé */
      width: 44px; height: 44px; border-radius: 50%;
      background: #1c1c1e; border: 1px solid rgba(255,255,255,0.2);
      color: var(--accent); font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 90;
      transition: bottom 0.4s;
    }
    #sheet.expanded ~ .fab-loc { bottom: 88%; }

    /* Leaflet custom */
    .leaflet-popup-content-wrapper { background: rgba(30,30,30,0.95); color: #fff; border-radius: 12px; }
    .leaflet-popup-tip { background: rgba(30,30,30,0.95); }
  </style>
</head>
<body>

  <div id="map"></div>
  
  <div class="fab-loc" onclick="locateUser()">📍</div>

  <div id="sheet">
    <div class="handle-area" onclick="toggleSheet()">
      <div class="handle"></div>
    </div>
    
    <div class="content">
      <h1 onclick="toggleSheet()">Planning Détaillé</h1>
      <div class="subtitle">Cliquez pour agrandir la liste</div>

      <div id="list-container">
        </div>
      
      <div style="height:20px"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // --- DONNÉES (MISES A JOUR) ---
    const HOTEL_URL = "https://maps.app.goo.gl/AJ9SH4uj9FrQePMK6?g_st=ipc";

    const POIS = [
      { key: "airport", name: "Aéroport Marco Polo", coords: [45.5053, 12.3519], url: "https://www.google.com/maps/search/?api=1&query=Aeroporto+Marco+Polo+Venise" },
      { key: "piazzale", name: "Piazzale Roma (Bus)", coords: [45.4380, 12.3181], url: "https://www.google.com/maps/search/?api=1&query=Piazzale+Roma+Venice" },
      { key: "hotel", name: "Hôtel (Calle Minelli)", coords: [45.4339, 12.3320], url: HOTEL_URL },
      { key: "stmarks", name: "Basilique St-Marc", coords: [45.4342, 12.3378], url: "https://www.google.com/maps/search/?api=1&query=Basilica+di+San+Marco" },
      { key: "rialto", name: "Pont du Rialto", coords: [45.4380, 12.3358], url: "https://www.google.com/maps/search/?api=1&query=Ponte+di+Rialto" },
      { key: "allarco", name: "Cicchetti All’Arco", coords: [45.4384, 12.3353], url: "https://www.google.com/maps/search/?api=1&query=Osteria+All+Arco+Venice" },
      { key: "resto", name: "Trattoria Pontini", coords: [45.4440, 12.3253], url: "https://www.google.com/maps/search/?api=1&query=Trattoria+Bar+Pontini+Venice" },
      { key: "doge", name: "Palais des Doges", coords: [45.4339, 12.3404], url: "https://www.google.com/maps/search/?api=1&query=Palazzo+Ducale+Venezia" }
    ];

    // --- PROGRAMME EXHAUSTIF ---
    const TIMELINE = [
      {
        time: "VENDREDI • ARRIVÉE",
        title: "Transfert Hôtel",
        desc: "1. Navette aéroport vers <b>Piazzale Roma</b> (20 min).<br>2. Vaporetto Ligne 1 ou 2 jusqu'à <b>Rialto</b> ou <b>San Marco</b>.<br>3. Marche 5-10 min vers Calle Minelli.",
        poi: "hotel"
      },
      {
        time: "SAMEDI • 09:00",
        title: "Basilique Saint-Marc",
        desc: "Y aller dès l'ouverture pour éviter la file (entrée sans résa possible). Voir les mosaïques dorées.",
        poi: "stmarks"
      },
      {
        time: "SAMEDI • 11:00",
        title: "Balade vers Rialto",
        desc: "Marcher via les Mercerie. Monter sur le pont pour la vue sur le Grand Canal.",
        poi: "rialto"
      },
      {
        time: "SAMEDI • 12:30",
        title: "Déjeuner Cicchetti",
        desc: "Traverser le pont côté marché. Arrêt chez <b>All'Arco</b> ou Do Mori pour grignoter debout (tapas vénitiens).",
        poi: "allarco"
      },
      {
        time: "SAMEDI • 20:00",
        title: "Dîner Cannaregio",
        desc: "Direction le quartier juif/Cannaregio. Dîner à la <b>Trattoria Pontini</b> (1268). Réservation conseillée.",
        poi: "resto"
      },
      {
        time: "DIMANCHE • MATIN",
        title: "Palais des Doges",
        desc: "Visite du Palais et du Pont des Soupirs. Alternative : Vaporetto Ligne 1 tout le long du Grand Canal.",
        poi: "doge"
      },
      {
        time: "DIMANCHE • 17:00",
        title: "Départ Aéroport",
        desc: "Quitter l'hôtel max 17h00. Vaporetto vers Piazzale Roma, puis Bus vers VCE. Vol à 20h00.",
        poi: "airport"
      }
    ];

    // --- SETUP CARTE ---
    const map = L.map('map', { zoomControl: false }).setView([45.436, 12.335], 14);
    
    // Fond de carte sombre HD
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 20
    }).addTo(map);

    const markers = {};

    function initMap() {
      POIS.forEach(p => {
        // Icone simple
        const icon = L.divIcon({
          className: 'custom-pin',
          html: `<div style="width:12px;height:12px;background:#0A84FF;border:2px solid #fff;border-radius:50%;box-shadow:0 0 10px #0A84FF"></div>`,
          iconSize: [16, 16]
        });

        const m = L.marker(p.coords, { icon: icon }).addTo(map);
        m.bindPopup(`<b>${p.name}</b><br><a href="${p.url}" target="_blank" style="color:#0A84FF">Ouvrir GPS</a>`);
        markers[p.key] = m;
      });
    }

    // --- SETUP LISTE ---
    function initList() {
      const container = document.getElementById('list-container');
      
      let html = '';
      TIMELINE.forEach(item => {
        const poiData = POIS.find(p => p.key === item.poi);
        const gpsLink = poiData ? poiData.url : '#';
        
        html += `
          <div class="step">
            <div class="icon-box"></div>
            <div class="info-box">
              <div class="time">${item.time}</div>
              <div class="step-title">${item.title}</div>
              <div class="details">
                ${item.desc}
                <div class="actions">
                  <div class="btn btn-loc" onclick="focusMap('${item.poi}')">👀 Voir sur carte</div>
                  <a href="${gpsLink}" target="_blank" class="btn btn-go">📍 Y aller</a>
                </div>
              </div>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // --- INTERACTIONS ---
    function toggleSheet() {
      document.getElementById('sheet').classList.toggle('expanded');
    }

    function focusMap(key) {
      // 1. Réduire la liste pour voir la carte
      document.getElementById('sheet').classList.remove('expanded');
      
      // 2. Zoomer
      const m = markers[key];
      if(m) {
        map.setView(m.getLatLng(), 16);
        m.openPopup();
      }
    }

    function locateUser() {
      if(!navigator.geolocation) return alert('GPS non dispo');
      navigator.geolocation.getCurrentPosition(pos => {
        const ll = [pos.coords.latitude, pos.coords.longitude];
        L.circleMarker(ll, { color: '#30d158', radius: 8, fillOpacity:1 }).addTo(map);
        map.setView(ll, 15);
      });
    }

    // Start
    initMap();
    initList();

  </script>
</body>
</html>
