<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Venise</title>
  
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%231c1c1e%22/><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg: #000000;
      --panel: #1c1c1e;
      --accent: #0A84FF;
      --accent-glow: rgba(10, 132, 255, 0.4);
      --text: #ffffff;
      --text-muted: #98989d;
      --border: rgba(255, 255, 255, 0.12);
    }

    body {
      margin: 0; padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      height: 100vh; width: 100vw;
      user-select: none; -webkit-user-select: none;
    }

    /* --- MAP (PREND TOUT L'ÉCRAN) --- */
    #map-container {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      background: #2c2c2c;
    }
    #map { width: 100%; height: 100%; }

    /* Bouton Géoloc (Flottant) */
    .locate-btn {
      position: absolute; bottom: calc(15% + 40px); right: 16px;
      width: 48px; height: 48px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 50%;
      z-index: 50;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: bottom 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .locate-btn:active { transform: scale(0.92); }

    /* --- SHEET (PANNEAU) --- */
    #sheet {
      position: absolute; left: 0; right: 0; bottom: 0;
      height: 85%;
      background: var(--panel);
      border-top-left-radius: 24px; border-top-right-radius: 24px;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.6);
      z-index: 100;
      display: flex; flex-direction: column;
      transform: translateY(45%); /* Position initiale (mi-hauteur) */
      transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    }

    /* États du Sheet */
    #sheet.is-open { transform: translateY(0); }
    #sheet.is-half { transform: translateY(45%); }
    #sheet.is-minimized { transform: translateY(82%); }

    /* Ajustement bouton géoloc selon état sheet */
    #sheet.is-minimized ~ .locate-btn { bottom: calc(18% + 40px); }
    #sheet.is-open ~ .locate-btn { opacity: 0; pointer-events: none; }

    /* Header Sheet */
    .sheet-header {
      flex: 0 0 auto;
      padding-top: 10px;
      cursor: pointer;
      background: rgba(28,28,30,0.98);
      border-bottom: 1px solid var(--border);
      border-top-left-radius: 24px; border-top-right-radius: 24px;
    }

    .handle-bar {
      width: 100%; height: 24px; display: flex; justify-content: center; align-items: center;
    }
    .handle { width: 40px; height: 5px; background: #48484a; border-radius: 10px; }

    .header-content { padding: 0 20px 16px 20px; }
    h1 { font-size: 22px; margin: 0; font-weight: 700; letter-spacing: -0.3px; }
    .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

    /* Filtres (Puces) */
    .filters-bar {
      padding: 0 16px 12px 16px;
      overflow-x: auto; white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filters-bar::-webkit-scrollbar { display: none; }

    .chip {
      display: inline-block;
      padding: 8px 16px; margin-right: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      font-size: 14px; font-weight: 600; color: var(--text-muted);
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .chip.active {
      background: var(--text); color: black; border-color: white;
    }

    /* Contenu scrollable */
    .scroll-content {
      flex: 1; overflow-y: auto;
      padding: 20px 20px 80px 20px;
      -webkit-overflow-scrolling: touch;
      background: var(--bg);
    }

    /* Carte Info (Hôtel) */
    .info-card {
      background: var(--panel); padding: 16px; border-radius: 16px;
      margin-bottom: 24px; border: 1px solid var(--border);
    }
    .info-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
    .info-row:last-child { margin: 0; }
    .val { font-weight: 600; text-align: right; }

    /* Timeline Items */
    .item { display: flex; gap: 14px; margin-bottom: 24px; position: relative; }
    .dot-col {
      display: flex; flex-direction: column; align-items: center; min-width: 16px;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #333; margin-top: 6px; z-index: 2; border: 2px solid var(--bg); }
    .line { width: 2px; background: #333; flex: 1; margin-top: -2px; min-height: 20px; opacity: 0.3; }
    .item:last-child .line { display: none; }

    .card-content {
      flex: 1; background: var(--panel); padding: 16px; border-radius: 18px;
      border: 1px solid var(--border);
    }
    
    /* Highlight "En ce moment" */
    .item.current .dot { background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); transform: scale(1.2); }
    .item.current .card-content { border: 1px solid var(--accent); box-shadow: 0 0 15px rgba(10,132,255,0.15); }
    .item.current .time-badge { color: var(--accent); }

    .time-badge { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
    .item-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; color: #fff; }
    .item-desc { font-size: 14px; color: #ccc; line-height: 1.5; margin-bottom: 14px; }

    /* Boutons actions */
    .actions { display: flex; gap: 10px; }
    .btn-action {
      flex: 1; padding: 10px 0; border-radius: 10px;
      font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; text-decoration: none;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-zoom { background: rgba(255,255,255,0.1); color: white; border: none; }
    .btn-map { background: var(--accent); color: white; border: none; }

    /* Map Popup */
    .leaflet-popup-content-wrapper { 
      background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(10px);
      color: white; border-radius: 14px; border: 1px solid rgba(255,255,255,0.2); padding: 0;
    }
    .leaflet-popup-content { margin: 12px 14px; line-height: 1.4; }
    .leaflet-popup-tip { background: rgba(30, 30, 30, 0.95); }
    .leaflet-container a { color: var(--accent); }
    
  </style>
</head>
<body>

  <div id="map-container">
    <div id="map"></div>
  </div>

  <div class="locate-btn" onclick="locateUser()">📍</div>

  <div id="sheet" class="is-half">
    
    <div class="sheet-header" id="sheetHeader">
      <div class="handle-bar"><div class="handle"></div></div>
      <div class="header-content">
        <h1>Week-end Venise</h1>
        <div class="subtitle">Hôtel San Marco • Vol Dim. 20h00</div>
      </div>
      
      <div class="filters-bar">
        <div class="chip active" onclick="setMode(event, 'all')" id="btn-all">Tout</div>
        <div class="chip" onclick="setMode(event, 'fri')" id="btn-fri">Ven.</div>
        <div class="chip" onclick="setMode(event, 'sat')" id="btn-sat">Sam.</div>
        <div class="chip" onclick="setMode(event, 'sun')" id="btn-sun">Dim.</div>
        <div class="chip" onclick="setMode(event, 'food')" id="btn-food">Restos</div>
        <div class="chip" onclick="setMode(event, 'return')" id="btn-return">Retour</div>
      </div>
    </div>

    <div class="scroll-content">
      
      <div class="info-card">
        <div class="info-row"><span class="lbl" style="color:#aaa">🏨 Hôtel</span><span class="val">Calle Minelli 1887</span></div>
        <div class="info-row"><span class="lbl" style="color:#aaa">🍽️ Samedi</span><span class="val">Cannaregio 1268 (Résa OK)</span></div>
        <div class="info-row" style="margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.1); font-size:12px; color:#ffd60a">
          <span>⚠️ Basilique St-Marc : venir tôt (09h00) sans résa.</span>
        </div>
      </div>

      <div id="timeline-list"></div>
      
      <div style="height: 40px;"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // --- DATA ---
    // URL spécifique de l'hôtel incluse
    const POIS = [
      { key: "airport", name: "Aéroport (VCE)", coords: [45.5053, 12.3519], emoji: "✈️", url: "https://www.google.com/maps/search/?api=1&query=Aeroporto+Marco+Polo+Venise" },
      { key: "piazzale", name: "Piazzale Roma", coords: [45.4380, 12.3181], emoji: "🚌", url: "https://www.google.com/maps/search/?api=1&query=Piazzale+Roma+Venice" },
      { key: "hotel", name: "Hôtel (Calle Minelli)", coords: [45.4339, 12.3320], emoji: "🏨", url: "https://maps.app.goo.gl/AJ9SH4uj9FrQePMK6?g_st=ipc" },
      { key: "stmarks", name: "Basilique St-Marc", coords: [45.4342, 12.3378], emoji: "🕍", url: "https://www.google.com/maps/search/?api=1&query=Basilica+di+San+Marco" },
      { key: "campanile", name: "Campanile", coords: [45.4340, 12.3390], emoji: "🔭", url: "https://www.google.com/maps/search/?api=1&query=Campanile+di+San+Marco" },
      { key: "rialto", name: "Pont du Rialto", coords: [45.4380, 12.3358], emoji: "🌉", url: "https://www.google.com/maps/search/?api=1&query=Ponte+di+Rialto" },
      { key: "allarco", name: "All’Arco", coords: [45.4384, 12.3353], emoji: "🥪", url: "https://www.google.com/maps/search/?api=1&query=Osteria+All+Arco+Venice" },
      { key: "domori", name: "Cantina Do Mori", coords: [45.4381, 12.3360], emoji: "🍷", url: "https://www.google.com/maps/search/?api=1&query=Cantina+Do+Mori" },
      { key: "restaurant", name: "Trattoria Pontini", coords: [45.4440, 12.3253], emoji: "🍽️", url: "https://www.google.com/maps/search/?api=1&query=Trattoria+Bar+Pontini+Venice" },
      { key: "doge", name: "Palais des Doges", coords: [45.4339, 12.3404], emoji: "🏛️", url: "https://www.google.com/maps/search/?api=1&query=Palazzo+Ducale+Venezia" }
    ];

    // DÉTAILS COMPLETS ICI
    const TIMELINE = [
      { id: "fri", day: 5, hMin: 14, hMax: 23, t: "VENDREDI SOIR", title: "Arrivée & Transfert", txt: "1. Navette aéroport vers <b>Piazzale Roma</b> (20 min).<br>2. Vaporetto Ligne 1/2 vers Rialto ou St-Marc.<br>3. Marche vers hôtel (Calle Minelli).", focus: "hotel", color: "#0A84FF" },
      
      { id: "sat_m", day: 6, hMin: 0, hMax: 12, t: "SAMEDI MATIN", title: "Saint-Marc", txt: "Y aller dès l'ouverture (09h00) pour éviter la file. Entrée possible sans résa. Campanile ensuite si beau temps.", focus: "stmarks", color: "#30D158" },
      
      { id: "sat_l", day: 6, hMin: 12, hMax: 17, t: "SAMEDI MIDI", title: "Rialto & Cicchetti", txt: "Traverser le pont Rialto côté marché. Manger des Cicchetti debout chez <b>All'Arco</b> ou Do Mori.", focus: "allarco", color: "#FFD60A" },
      
      { id: "sat_d", day: 6, hMin: 17, hMax: 23, t: "SAMEDI SOIR", title: "Dîner Cannaregio", txt: "Balade quartier Cannaregio. Dîner à la <b>Trattoria Pontini</b> (1268).", focus: "restaurant", color: "#BF5AF2" },
      
      { id: "sun", day: 0, hMin: 8, hMax: 20, t: "DIMANCHE", title: "Doges & Retour", txt: "Matin : Palais des Doges (Pont des Soupirs).<br><b>17h00</b> : Quitter l'hôtel.<br>Vaporetto → Bus → Aéroport (Vol 20h00).", focus: "airport", color: "#FF453A" }
    ];

    const ROUTES = {
      all: POIS.map(p => p.key),
      fri: ["airport", "piazzale", "hotel"],
      sat: ["hotel", "stmarks", "campanile", "rialto", "allarco", "restaurant"],
      sun: ["hotel", "doge", "airport"],
      food: ["allarco", "domori", "restaurant"],
      return: ["hotel", "piazzale", "airport"]
    };

    // --- UI ---
    const sheet = document.getElementById('sheet');
    const sheetHeader = document.getElementById('sheetHeader');
    
    // Sheet Interaction
    sheetHeader.addEventListener('click', (e) => {
      if(e.target.closest('.chip')) return;
      if(sheet.classList.contains('is-minimized')) {
        sheet.classList.remove('is-minimized');
        sheet.classList.add('is-half');
      } else {
        sheet.classList.remove('is-half');
        sheet.classList.remove('is-open');
        sheet.classList.add('is-minimized');
      }
    });

    // --- MAP ---
    let map, markers = {}, polyline;

    function initMap() {
      map = L.map('map', { zoomControl: false, attributionControl: false }).setView([45.436, 12.335], 14);
      // Carte COULEUR (Standard OSM) comme demandé
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      setTimeout(() => map.invalidateSize(), 500);
    }

    // --- LISTE ---
    function initTimeline() {
      const now = new Date();
      const currentDay = now.getDay(); 
      const currentHour = now.getHours();
      
      const el = document.getElementById('timeline-list');
      
      el.innerHTML = TIMELINE.map(item => {
        const poi = POIS.find(p => p.key === item.focus);
        const mapLink = (poi && poi.url) ? poi.url : "#";
        
        let isCurrent = false;
        if(item.day === currentDay && currentHour >= item.hMin && currentHour < item.hMax) {
          isCurrent = true;
        }

        return `
          <div class="item ${isCurrent ? 'current' : ''}" id="item-${item.id}">
            <div class="dot-col">
              <div class="dot" style="background:${item.color}"></div>
              <div class="line"></div>
            </div>
            <div class="card-content">
              <div class="time-badge">${item.t} ${isCurrent ? '• EN CE MOMENT' : ''}</div>
              <div class="item-title">${item.title}</div>
              <div class="item-desc">${item.txt}</div>
              <div class="actions">
                <button class="btn-action btn-zoom" onclick="zoomTo('${item.focus}')">Voir plan</button>
                <a href="${mapLink}" target="_blank" class="btn-action btn-map">📍 Go (GPS)</a>
              </div>
            </div>
          </div>`;
      }).join('');
      
      const currentEl = document.querySelector('.item.current');
      if(currentEl) {
        setTimeout(() => currentEl.scrollIntoView({ behavior: 'smooth', block: 'center' }), 800);
      }
    }

    // --- LOGIQUE FILTRES ---
    window.setMode = function(e, mode) {
      if(e) e.stopPropagation();
      
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      const btn = document.getElementById('btn-' + mode);
      if(btn) btn.classList.add('active');

      for (let k in markers) map.removeLayer(markers[k]);
      if (polyline) map.removeLayer(polyline);
      markers = {};

      const keys = ROUTES[mode] || ROUTES.all;
      const points = [];

      keys.forEach((k, i) => {
        const p = POIS.find(x => x.key === k);
        if (!p) return;

        const icon = L.divIcon({
          className: 'pin',
          html: `<div style="background:${i === 0 ? '#fff' : '#0A84FF'}; color:${i === 0 ? '#000' : '#fff'}; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid white; font-weight:700; font-size:13px; box-shadow:0 3px 6px rgba(0,0,0,0.4)">${i+1}</div>`,
          iconSize: [26,26], iconAnchor: [13,13]
        });

        const m = L.marker(p.coords, { icon: icon }).addTo(map);
        const link = p.url || "#";
        
        m.bindPopup(`
          <div style="text-align:center; min-width:160px; font-family:-apple-system">
            <div style="font-size:24px;margin-bottom:4px">${p.emoji}</div>
            <div style="font-weight:700;font-size:15px;color:#333;margin-bottom:8px">${p.name}</div>
            <a href="${link}" target="_blank" style="display:inline-block;padding:8px 16px;background:#0A84FF;color:white;text-decoration:none;border-radius:20px;font-size:12px;font-weight:600">Ouvrir GPS</a>
          </div>
        `);
        
        markers[k] = m;
        points.push(p.coords);
      });

      if (points.length) map.fitBounds(L.latLngBounds(points), { padding: [50, 50], maxZoom: 16 });
      
      if (['fri', 'sat', 'return', 'food'].includes(mode) && points.length > 1) {
        polyline = L.polyline(points, { color: '#0A84FF', weight: 4, opacity: 0.7, dashArray: '1, 8' }).addTo(map);
      }
    };

    window.zoomTo = function(key) {
      sheet.classList.remove('is-half');
      sheet.classList.remove('is-open');
      sheet.classList.add('is-minimized');

      if (markers[key]) {
        map.setView(markers[key].getLatLng(), 17);
        setTimeout(() => markers[key].openPopup(), 400);
      } else {
        setMode(null, 'all');
        setTimeout(() => zoomTo(key), 200);
      }
    };

    window.locateUser = function() {
      if (!navigator.geolocation) return alert("Activez le GPS.");
      const btn = document.querySelector('.locate-btn');
      btn.innerHTML = '⌛';
      
      navigator.geolocation.getCurrentPosition(pos => {
        btn.innerHTML = '📍';
        const ll = [pos.coords.latitude, pos.coords.longitude];
        L.circleMarker(ll, { radius: 8, color: 'white', weight: 3, fillColor: '#0A84FF', fillOpacity: 1 }).addTo(map);
        map.setView(ll, 16);
        sheet.classList.add('is-minimized');
        sheet.classList.remove('is-half');
      }, () => {
        btn.innerHTML = '📍';
        alert("Position introuvable.");
      }, { enableHighAccuracy: true });
    };

    // Init
    initMap();
    initTimeline();
    setMode(null, 'all');
  </script>
</body>
</html>
