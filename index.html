<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Venise Plan</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg: #121212;
      --panel: #1e1e1e;
      --accent: #0A84FF;
      --text: #ffffff;
      --text-muted: #a0a0a0;
    }

    body {
      margin: 0; padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden; /* Important pour app mobile */
      height: 100vh;
      width: 100vw;
    }

    /* --- DIAGNOSTIC (Debug) --- */
    #debug-log {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(255, 0, 0, 0.9); color: white;
      font-size: 10px; padding: 2px; z-index: 9999;
      display: none; white-space: pre-wrap;
    }

    /* --- LAYOUT ABSOLU (Plus robuste que Flexbox pour les maps) --- */
    #map-container {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 40%; /* 40% de l'écran */
      background: #2c2c2c; /* Gris en attendant la map */
      z-index: 1;
    }
    
    #map { width: 100%; height: 100%; }

    #content-container {
      position: absolute;
      top: 40%; left: 0; right: 0; bottom: 0;
      background: var(--bg);
      z-index: 2;
      display: flex; flex-direction: column;
      border-top: 1px solid #333;
    }

    /* --- FILTRES (Scroll horizontal) --- */
    .filters-bar {
      flex: 0 0 auto;
      padding: 12px 16px;
      background: rgba(30,30,30,0.95);
      border-bottom: 1px solid #333;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }
    .filters-bar::-webkit-scrollbar { display: none; }

    .chip {
      display: inline-block;
      padding: 8px 16px;
      margin-right: 8px;
      background: #333;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .chip.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 2px 8px rgba(10,132,255,0.4);
    }

    /* --- LISTE SCROLLABLE --- */
    .scroll-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 40px;
    }

    h1 { font-size: 22px; margin: 0 0 5px 0; }
    p.sub { color: var(--text-muted); font-size: 13px; margin: 0 0 20px 0; }

    .card {
      background: var(--panel);
      padding: 15px;
      border-radius: 16px;
      margin-bottom: 15px;
      border: 1px solid #333;
    }

    .row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
    .row:last-child { margin: 0; }
    .lbl { color: var(--text-muted); }
    .val { font-weight: 600; text-align: right; }

    .item {
      display: flex; gap: 15px; margin-bottom: 20px;
    }
    .dot-col {
      display: flex; flex-direction: column; align-items: center; min-width: 20px;
    }
    .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); margin-top: 5px; }
    .line { width: 2px; background: #333; flex: 1; margin-top: 5px; min-height: 20px; }
    .item:last-child .line { display: none; }

    .info { flex: 1; background: var(--panel); padding: 12px; border-radius: 12px; }
    .time { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
    .title { font-size: 16px; font-weight: 700; margin: 4px 0; }
    .desc { font-size: 13px; color: var(--text-muted); line-height: 1.4; margin-bottom: 10px; }
    
    button.zoom {
      background: rgba(10,132,255,0.15); color: var(--accent);
      border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
    }

    /* Override Leaflet Popup */
    .leaflet-popup-content-wrapper { background: #222; color: #fff; }
    .leaflet-popup-tip { background: #222; }
  </style>
</head>
<body>

  <div id="debug-log"></div>

  <div id="map-container">
    <div id="map"></div>
    <div onclick="locateUser()" style="position:absolute; top:15px; right:15px; width:40px; height:40px; background:rgba(0,0,0,0.7); border-radius:10px; z-index:999; display:flex; align-items:center; justify-content:center; font-size:20px; border:1px solid #555;">📍</div>
  </div>

  <div id="content-container">
    
    <div class="filters-bar">
      <div class="chip active" onclick="setMode('all')" id="btn-all">Tout</div>
      <div class="chip" onclick="setMode('fri')" id="btn-fri">Vendredi</div>
      <div class="chip" onclick="setMode('sat')" id="btn-sat">Samedi</div>
      <div class="chip" onclick="setMode('sun')" id="btn-sun">Dimanche</div>
      <div class="chip" onclick="setMode('food')" id="btn-food">Restos</div>
      <div class="chip" onclick="setMode('return')" id="btn-return">Retour</div>
    </div>

    <div class="scroll-content">
      <h1>Week-end à Venise</h1>
      <p class="sub">Hôtel San Marco • Vol retour Dim. 20h00</p>

      <div class="card">
        <div class="row"><span class="lbl">🏨 Hôtel</span><span class="val">Calle Minelli 1887</span></div>
        <div class="row"><span class="lbl">🍽️ Samedi</span><span class="val">Cannaregio 1268 (Résa OK)</span></div>
      </div>

      <div id="timeline-app">
        </div>
      
      <div style="height: 50px;"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // --- GESTION ERREUR ---
    window.onerror = function(msg, url, line) {
      const d = document.getElementById('debug-log');
      d.style.display = 'block';
      d.innerText += "Erreur: " + msg + " (Ligne " + line + ")\n";
    };

    // --- DONNÉES ---
    const POIS = [
      { key: "airport", name: "Aéroport (VCE)", coords: [45.5053, 12.3519], day: "Ven/Dim", emoji: "✈️", desc: "Arrivée et départ" },
      { key: "piazzale", name: "Piazzale Roma", coords: [45.4380, 12.3181], day: "Ven", emoji: "🚌", desc: "Terminus Bus" },
      { key: "hotel", name: "Hôtel (Calle Minelli)", coords: [45.4339, 12.3320], day: "Tout", emoji: "🏨", desc: "Base San Marco" },
      { key: "stmarks", name: "Basilique St-Marc", coords: [45.4342, 12.3378], day: "Sam", emoji: "🕍", desc: "Matin 09:00" },
      { key: "campanile", name: "Campanile", coords: [45.4340, 12.3390], day: "Sam", emoji: "🔭", desc: "Vue panoramique" },
      { key: "rialto", name: "Pont du Rialto", coords: [45.4380, 12.3358], day: "Sam", emoji: "🌉", desc: "Zone déjeuner" },
      { key: "allarco", name: "All’Arco", coords: [45.4384, 12.3353], day: "Sam", emoji: "🥪", desc: "Cicchetti" },
      { key: "domori", name: "Cantina Do Mori", coords: [45.4381, 12.3360], day: "Sam", emoji: "🍷", desc: "Vieux bacaro" },
      { key: "restaurant", name: "Resto Cannaregio", coords: [45.4440, 12.3253], day: "Sam", emoji: "🍽️", desc: "Dîner Samedi" },
      { key: "doge", name: "Palais des Doges", coords: [45.4339, 12.3404], day: "Dim", emoji: "🏛️", desc: "Matin" }
    ];

    const TIMELINE = [
      { t: "VENDREDI SOIR", title: "Arrivée", txt: "Bus vers Piazzale Roma puis Vaporetto/Pied vers l'hôtel.", focus: "hotel", color: "#0A84FF" },
      { t: "SAMEDI MATIN", title: "Saint-Marc", txt: "Basilique tôt (sans résa) puis Campanile.", focus: "stmarks", color: "#30D158" },
      { t: "SAMEDI MIDI", title: "Rialto & Food", txt: "Cicchetti à la volée autour du marché.", focus: "allarco", color: "#FFD60A" },
      { t: "SAMEDI SOIR", title: "Cannaregio", txt: "Apéro Misericordia puis Dîner au 1268.", focus: "restaurant", color: "#BF5AF2" },
      { t: "DIMANCHE", title: "Doges & Retour", txt: "Matin Doges. Départ hôtel 17h00.", focus: "airport", color: "#FF453A" }
    ];

    const ROUTES = {
      all: POIS.map(p => p.key),
      fri: ["airport", "piazzale", "hotel"],
      sat: ["hotel", "stmarks", "campanile", "rialto", "allarco", "restaurant"],
      sun: ["hotel", "doge", "airport"],
      food: ["allarco", "domori", "restaurant"],
      return: ["hotel", "piazzale", "airport"]
    };

    // --- VARIABLES GLOBALES ---
    let map = null;
    let markers = {};
    let currentPolyline = null;

    // --- INITIALISATION ---
    document.addEventListener("DOMContentLoaded", () => {
      try {
        initMap();
        initTimeline();
        setMode('all');
      } catch (e) {
        document.getElementById('debug-log').style.display='block';
        document.getElementById('debug-log').innerText += "Init Error: " + e.message;
      }
    });

    function initMap() {
      // 1. Créer la map
      map = L.map('map', { zoomControl: false }).setView([45.436, 12.335], 14);

      // 2. Ajouter les tuiles (OpenStreetMap Standard = très fiable)
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OSM'
      }).addTo(map);

      // 3. Forcer le redimensionnement (fixe le bug de l'écran gris/noir)
      setTimeout(() => { map.invalidateSize(); }, 500);
    }

    function initTimeline() {
      const container = document.getElementById('timeline-app');
      let html = "";
      TIMELINE.forEach(item => {
        html += `
          <div class="item">
            <div class="dot-col">
              <div class="dot" style="background:${item.color}"></div>
              <div class="line"></div>
            </div>
            <div class="info">
              <div class="time">${item.t}</div>
              <div class="title">${item.title}</div>
              <div class="desc">${item.txt}</div>
              <button class="zoom" onclick="zoomTo('${item.focus}')">Voir sur la carte</button>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // --- FONCTIONS LOGIQUES ---
    window.setMode = function(mode) {
      // UI Update
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      const btn = document.getElementById('btn-' + mode);
      if(btn) btn.classList.add('active');

      // Map Clean
      for (let k in markers) map.removeLayer(markers[k]);
      markers = {};
      if (currentPolyline) map.removeLayer(currentPolyline);

      // Filter Data
      const keys = ROUTES[mode] || ROUTES.all;
      const points = [];

      keys.forEach((k, i) => {
        const p = POIS.find(x => x.key === k);
        if (p) {
          // Marker Icon
          const icon = L.divIcon({
            className: 'custom-pin',
            html: `<div style="background:#0A84FF;color:white;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid white;font-weight:bold;font-size:12px;box-shadow:0 2px 5px rgba(0,0,0,0.5)">${i+1}</div>`,
            iconSize: [24,24],
            iconAnchor: [12,12]
          });

          // Create Marker
          const m = L.marker(p.coords, { icon: icon }).addTo(map);
          
          // Popup
          const popupContent = `<div style="text-align:center"><b>${p.emoji} ${p.name}</b><br><span style="font-size:11px;opacity:0.8">${p.desc}</span></div>`;
          m.bindPopup(popupContent);
          
          markers[k] = m;
          points.push(p.coords);
        }
      });

      // Fit Bounds
      if (points.length > 0) {
        map.fitBounds(L.latLngBounds(points), { padding: [50, 50], maxZoom: 16 });
      }

      // Draw Line (si pertinent)
      if (['fri', 'sat', 'return', 'food'].includes(mode) && points.length > 1) {
        currentPolyline = L.polyline(points, { color: '#0A84FF', weight: 3, opacity: 0.7, dashArray: '5, 10' }).addTo(map);
      }
    };

    window.zoomTo = function(key) {
      const p = POIS.find(x => x.key === key);
      if (p) {
        map.setView(p.coords, 16);
        // On attend que le mouvement finisse pour ouvrir la popup
        setTimeout(() => {
          if(markers[key]) markers[key].openPopup();
        }, 300);
        // Scroll top mobile
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    };

    window.locateUser = function() {
      if (!navigator.geolocation) { alert("Pas de GPS"); return; }
      navigator.geolocation.getCurrentPosition(pos => {
        const ll = [pos.coords.latitude, pos.coords.longitude];
        L.circleMarker(ll, { radius: 8, color: 'white', fillColor: '#0A84FF', fillOpacity: 1 }).addTo(map);
        map.setView(ll, 15);
      }, err => {
        alert("Erreur GPS : " + err.message + "\n(Vérifiez que vous êtes en HTTPS)");
      }, { enableHighAccuracy: true });
    };

  </script>
</body>
</html>
